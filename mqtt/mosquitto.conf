# Mosquitto config for the Honeyswarm control + telemetry backbone.
# Secure by default: TLS-only (self-signed CA), authenticated, no cleartext.
#
# The CA, server cert and the controller's client cert are generated into the
# mqtt_secrets volume by the mqtt-init service on `docker compose up` — no
# pre-run scripts. Per-hive client certs are minted by the API at enrollment.

persistence true
persistence_location /mosquitto/data/

# TLS listener -- the only listener (no plaintext 1883).
listener 8883
protocol mqtt
cafile /mosquitto/config/secrets/ca.crt
certfile /mosquitto/config/secrets/server.crt
keyfile /mosquitto/config/secrets/server.key

# Mutual TLS: every client must present a CA-signed client certificate, and the
# MQTT username is taken from that certificate's CN. The controller's cert CN is
# "honeyswarm"; each hive gets a cert with CN == its hive id at enrollment.
require_certificate true
use_identity_as_username true

# No anonymous access (a client with no derived username is rejected).
allow_anonymous false

# Per-hive topic isolation: the ACL confines each hive identity to its own
# hive/<id>/* subtree, so a compromised hive cannot read or command any other.
# (Mounted at /honeyswarm by the compose `./mqtt:/honeyswarm:ro` bind.)
acl_file /honeyswarm/acl
