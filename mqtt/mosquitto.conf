# Mosquitto config for the Honeyswarm control + telemetry backbone.
# Carries controller->agent commands and agent->controller status + events,
# replacing both the Salt minion bus and the HPFeeds broker.

persistence true
persistence_location /mosquitto/data/

listener 1883
protocol mqtt

# --- DEV DEFAULT: anonymous access on the internal honeynet only ---
# The broker is not published to the host beyond the compose network in
# production deployments. Harden before exposing it (see below).
allow_anonymous true

# --- PRODUCTION HARDENING (uncomment, then provide passwd + acl) ---
# Generate the password file before starting the stack:
#   ./mqtt/gen-passwd.sh honeyswarm <controller-password>
# and add a per-hive entry at enrollment time. Then:
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl
#
# TLS listener (point agents at 8883):
# listener 8883
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
