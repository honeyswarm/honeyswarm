# Mosquitto config for the Honeyswarm control + telemetry backbone.
# Secure by default: TLS-only (self-signed CA), authenticated, no cleartext.
#
# Run ./mqtt/setup-security.sh once to generate certs/ and passwd before starting.

persistence true
persistence_location /mosquitto/data/

# TLS listener -- the only listener (no plaintext 1883).
listener 8883
protocol mqtt
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
# Server-authenticated TLS; clients authenticate with username/password (below).
# Set to true to additionally require client certificates (mTLS).
require_certificate false

# Authentication: no anonymous access.
allow_anonymous false
password_file /mosquitto/config/passwd

# Optional per-hive topic isolation (username == hive id). Enable once agents
# use per-hive credentials; with a shared credential leave this commented.
# acl_file /mosquitto/config/acl
