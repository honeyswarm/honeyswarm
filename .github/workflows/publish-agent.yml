name: Publish agent image

# Builds and pushes the hive agent image to GHCR so remote hosts can pull it
# via the enrollment install command (AGENT_IMAGE).
on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/publish-agent.yml"
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/honeyswarm-agent

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disable SLSA provenance/SBOM attestations — they make buildx push a
          # multi-manifest index that GHCR intermittently rejects ("unknown blob").
          provenance: false
          sbom: false
