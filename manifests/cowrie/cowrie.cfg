# Cowrie config rendered by the hive agent. UPPERCASE tokens are substituted
# from the deploy command's vars (e.g. INSTANCEID, COWRIEHOSTNAME).
#
# Changed from the legacy config: the [output_hpfeeds3] block is replaced by
# [output_jsonlog] so the agent can tail events instead of using HPFeeds.

[honeypot]
sensor_name = INSTANCEID
hostname = COWRIEHOSTNAME
reported_ssh_port = 22

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0
reported_port = 23

# JSON event log -- tailed by the Honeyswarm agent and shipped over MQTT.
[output_jsonlog]
enabled = true
logfile = /cowrie/cowrie-git/var/log/cowrie/cowrie.json
epoch_timestamp = true

[output_crashreporter]
enabled = false
debug = false
