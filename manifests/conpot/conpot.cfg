; Conpot config for the pinned honeynet/conpot:latest image (Conpot 0.6.0).
;
; This is the image's bundled testing.cfg with three deliberate changes:
;   * [json] enabled  -> the agent tails this JSONL file, one event per line.
;   * [virtual_file_system] fs_url -> the bundled data.tar (instead of "default",
;     which would force conpot's -f flag — and -f ignores --config, disabling JSON).
;     data_fs_url is a writable dir for emulated "uploads".
;   * [fetch_public_ip] disabled -> no outbound call on every startup.
; The fs_url path is specific to this pinned image's layout.
[common]
sensorid = honeyswarm

[virtual_file_system]
data_fs_url = /tmp
fs_url = tar:///home/conpot/.local/lib/python3.6/site-packages/conpot-0.6.0-py3.6.egg/conpot/data.tar

[session]
timeout = 30

[daemon]
;user = conpot
;group = conpot

[json]
enabled = True
filename = /var/log/conpot/conpot.json

[sqlite]
enabled = False

[mysql]
enabled = False
device = /tmp/mysql.sock
host = localhost
port = 3306
db = conpot
username = conpot
passphrase = conpot
socket = tcp

[syslog]
enabled = False
device = /dev/log
host = localhost
port = 514
facility = local0
socket = dev

[hpfriends]
enabled = False
host = hpfriends.honeycloud.net
port = 20000
ident = 3Ykf9Znv
secret = 4nFRhpm44QkG9cvD
channels = ["conpot.events", ]

[taxii]
enabled = False
host = taxiitest.mitre.org
port = 80
inbox_path = /services/inbox/default/
use_https = False

[fetch_public_ip]
enabled = False
urls = ["http://whatismyip.akamai.com/", "http://wgetip.com/"]

[change_mac_addr]
enabled = False
iface = eth0
addr = 00:de:ad:be:ef:00
