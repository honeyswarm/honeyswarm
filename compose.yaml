# Honeyswarm v2 — one-command stack.
#   cp .env.example .env   (edit secrets)
#   docker compose up -d
# The mqtt-init service self-generates TLS certs + the password file on boot,
# so there are no pre-run scripts.
name: honeyswarm

services:
  # One-shot: generate the MQTT CA, server cert + controller client cert into the
  # mqtt_secrets volume (mutual TLS). Per-hive client certs are minted by the API.
  mqtt-init:
    image: eclipse-mosquitto:2
    container_name: honeyswarm_mqtt_init
    entrypoint: ["/bin/sh", "/init/init.sh"]
    restart: "no"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:-localhost}
      MQTT_EXTRA_SANS: ${MQTT_EXTRA_SANS:-}
    volumes:
      # Mount the dir (not a single file) — single-file binds are flaky on Docker Desktop/WSL.
      - ./mqtt:/init:ro
      - mqtt_secrets:/secrets
    networks:
      - honeynet

  mqtt:
    image: eclipse-mosquitto:2
    container_name: honeyswarm_mqtt
    restart: unless-stopped
    depends_on:
      mqtt-init:
        condition: service_completed_successfully
    command: ["/usr/sbin/mosquitto", "-c", "/honeyswarm/mosquitto.conf"]
    volumes:
      # Dir mount (robust on Docker Desktop/WSL); config references /mosquitto/config/secrets/*
      - ./mqtt:/honeyswarm:ro
      - mqtt_secrets:/mosquitto/config/secrets:ro
      - mqttData:/mosquitto/data
    ports:
      - "8883:8883"
    networks:
      - honeynet

  api:
    build:
      context: ./api
    container_name: honeyswarm_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MANIFESTS_DIR=/opt/honeyswarm/manifests
    volumes:
      - ./manifests:/opt/honeyswarm/manifests:ro
      - mqtt_secrets:/secrets:ro
    # No host `ports:` — the API is reached only through the Caddy edge (browser
    # via /api + /ws, hives via /agent). Other containers reach it as api:8080 on
    # the internal network.
    expose:
      - "8080"
    depends_on:
      mongo:
        condition: service_started
      opensearch:
        condition: service_healthy
      mqtt:
        condition: service_started
      mqtt-init:
        condition: service_completed_successfully
    networks:
      - honeynet

  mongo:
    image: mongo:7
    container_name: honeyswarm_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    volumes:
      - honeyswarmDB:/data/db
    networks:
      - honeynet

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: honeyswarm_opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}"
      - "DISABLE_SECURITY_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-true}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - openSearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - honeynet

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2
    container_name: honeyswarm_opensearch_dashboards
    restart: unless-stopped
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-true}"
      # NOT published to the host (no `ports:`). Reached only via Caddy at
      # /dashboards, gated by forward_auth against the Honeyswarm session. The
      # security plugin stays off by design: the trust boundary is the edge
      # proxy + the private docker network, so internal hops are plain HTTP.
      # basePath makes Dashboards emit correct asset URLs through the proxy.
      - "SERVER_BASEPATH=/dashboards"
      - "SERVER_REWRITEBASEPATH=true"
    expose:
      - "5601"
    depends_on:
      - opensearch
    networks:
      - honeynet

  web:
    build:
      context: ./web
    container_name: honeyswarm_web
    restart: unless-stopped
    environment:
      # Edge TLS bind address. Default :443 = self-signed HTTPS that works on any
      # hostname/IP (Caddy issues internal certs on demand). For a public domain
      # with real certs, set SITE_ADDRESS=<domain> and edit web/Caddyfile's tls
      # line to your email. Internal hops (api, dashboards) stay plain HTTP.
      - "SITE_ADDRESS=${SITE_ADDRESS:-:443}"
    volumes:
      - caddyData:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - opensearch-dashboards
    networks:
      - honeynet

networks:
  honeynet:
    driver: bridge

volumes:
  honeyswarmDB:
  openSearch:
  mqttData:
  mqtt_secrets:
  caddyData:
