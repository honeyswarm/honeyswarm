# Honeyswarm v2 control plane.
# Replaces the Salt master + HPFeeds broker + Elasticsearch/Kibana stack with
# a FastAPI API, an MQTT backbone, and OpenSearch.
services:
  api:
    build:
      context: ../api
    container_name: honeyswarm_api
    env_file:
      - .env
    environment:
      - MANIFESTS_DIR=/opt/honeyswarm/manifests
    volumes:
      - ../manifests:/opt/honeyswarm/manifests:ro
    ports:
      - "8080:8080"
    depends_on:
      - mongo
      - opensearch
      - mqtt
    networks:
      - honeynet

  mongo:
    image: mongo:7
    container_name: honeyswarm_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    volumes:
      - honeyswarmDB:/data/db
    networks:
      - honeynet

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: honeyswarm_opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}"
      - "DISABLE_SECURITY_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-true}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - openSearch:/usr/share/opensearch/data
    networks:
      - honeynet

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2
    container_name: honeyswarm_opensearch_dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-true}"
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    networks:
      - honeynet

  mqtt:
    image: eclipse-mosquitto:2
    container_name: honeyswarm_mqtt
    volumes:
      - ../mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttData:/mosquitto/data
      # Production: also mount passwd + acl and enable auth in mosquitto.conf
      # - ../mqtt/passwd:/mosquitto/config/passwd:ro
      # - ../mqtt/acl:/mosquitto/config/acl:ro
    ports:
      - "1883:1883"
      - "8883:8883"
    networks:
      - honeynet

  web:
    build:
      context: ../web
    container_name: honeyswarm_web
    volumes:
      - caddyData:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - honeynet

networks:
  honeynet:
    driver: bridge

volumes:
  honeyswarmDB:
  openSearch:
  mqttData:
  caddyData:
